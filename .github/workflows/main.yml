name: Inspect USGR_777 ELF
on: [push, workflow_dispatch]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PNGs and file strings
        run: |
          mkdir -p out
          python3 - << 'EOF'
          import re, struct

          data = open("unpakd_USGR_777.elf", "rb").read()

          print("=== CHEMINS CDROM0 / MC0 / HOST TROUVES ===")
          for m in re.finditer(rb"(?:cdrom0|mc0|mass|host):[^\x00]{1,60}", data):
              print(hex(m.start()), m.group(0).decode("ascii", "ignore"))

          print("\n=== SIGNATURES PNG TROUVEES ===")
          sig = b"\x89PNG\r\n\x1a\n"
          iend = b"IEND\xaeB`\x82"
          pos = 0
          idx = 0
          while True:
              pos = data.find(sig, pos)
              if pos == -1:
                  break
              end = data.find(iend, pos)
              if end != -1:
                  end += len(iend)
                  png_bytes = data[pos:end]
                  w, h = struct.unpack(">II", png_bytes[16:24])
                  fname = f"out/img_{idx}_{hex(pos)}_{w}x{h}.png"
                  open(fname, "wb").write(png_bytes)
                  print(f"Image {idx}: offset={hex(pos)} taille={len(png_bytes)} octets ({w}x{h}) -> {fname}")
              else:
                  print(f"Signature PNG partielle ou compressee a {hex(pos)}")
              pos += 8
              idx += 1
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: USGR-777-REPORT
          path: out/
