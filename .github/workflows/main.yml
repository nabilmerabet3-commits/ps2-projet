name: Build Custom FMCB 1.8 Installer
on: [push, workflow_dispatch]
jobs:
  build-fmcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect _splash.h & Link FMCB 1.8 Launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil git
          git clone --depth 1 https://github.com/ps2homebrew/FreeMcBoot.git fmcb_src || git clone --depth 1 https://github.com/AKuHAK/FreeMcBoot.git fmcb_src

          echo "=== EN-TETE DE _splash.h ==="
          head -n 35 fmcb_src/launcher2/_splash.h
          echo "=== UTILISATION DE SPLASH DANS LAUNCHER2 ==="
          grep -rn -C 5 -i "splash" fmcb_src/launcher2/

          cat << 'EOF' > fmcb_src/compat_2008.h
          #ifndef COMPAT_2008_H
          #define COMPAT_2008_H
          #include <tamtypes.h>
          #include <io_common.h>
          #ifndef fio_dirent_t
          typedef io_dirent_t fio_dirent_t;
          #endif
          typedef int CdvdDiscType_t;
          #define CDVD_INIT_INIT 0
          #define CDVD_INIT_NOCHECK 1
          #define CDVD_INIT_EXIT 5
          #define CDVD_STAT_OPEN 0x01
          #define CDVD_TYPE_NODISK 0x00
          #define CDVD_TYPE_DETCT 0x01
          #define CDVD_TYPE_DETECT 0x01
          #define CDVD_TYPE_PS1CD 0x10
          #define CDVD_TYPE_PS1CDDA 0x11
          #define CDVD_TYPE_PS2CD 0x12
          #define CDVD_TYPE_PS2CDDA 0x13
          #define CDVD_TYPE_PS2DVD 0x14
          #define CDVD_TYPE_CDDA 0xFD
          #define CDVD_TYPE_DVDVIDEO 0xFE
          #define CDVD_TYPE_ILLEGAL 0xFF
          #define CDVD_TYPE_UNKNOWN 0x05
          #endif
          EOF

          sed -i '1i #include "/src/compat_2008.h"' fmcb_src/launcher2/launcher2.c
          sed -i 's/make -C chkesr/#make -C chkesr/g; s/\$(MAKE) -C chkesr/#\$(MAKE) -C chkesr/g' fmcb_src/launcher2/Makefile
          printf ".globl chkesr_irx\n.globl size_chkesr_irx\nchkesr_irx:\n.word 0\nsize_chkesr_irx:\n.word 4\n" > fmcb_src/launcher2/chkesr.s

          docker run --rm -v "$PWD/fmcb_src:/src" -w /src ps2dev/ps2dev:v1.2.0 sh -c "export PS2DEV=/usr/local/ps2dev && export PS2SDK=\$PS2DEV/ps2sdk && export PATH=\$PATH:\$PS2DEV/bin:\$PS2DEV/ee/bin:\$PS2DEV/iop/bin:\$PS2DEV/dvp/bin:\$PS2SDK/bin && find \$PS2SDK -name '*.h' -exec sed -i 's/#error/\/\/#error/g' {} + && apk add --no-cache make gcc g++ && make -C launcher1 && make -C launcher2"
          find fmcb_src/launcher* -maxdepth 2 -type f
      - uses: actions/upload-artifact@v4
        with:
          name: FMCB-1.8-LAUNCHER
          path: |
            fmcb_src/launcher*/*.elf
            fmcb_src/launcher*/*.ELF
