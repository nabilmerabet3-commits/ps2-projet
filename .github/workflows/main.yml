name: Build Custom PS2 Boot Splash Launcher
on: [push, workflow_dispatch]
jobs:
  build-splash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Splash Header & Compile NABIL_SPLASH.ELF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          mkdir -p splash_src

          python3 - << 'EOF'
          from PIL import Image
          import os

          logo_path = "fmcb_logo.png" if os.path.exists("fmcb_logo.png") else "INJECT/fmcb_logo.png"
          img = Image.open(logo_path).convert("RGBA").resize((320, 110), Image.Resampling.LANCZOS)
          w, h = img.size

          with open("splash_src/logo_data.h", "w") as f:
              f.write('#include <tamtypes.h>\n\n')
              f.write(f'#define LOGO_W {w}\n')
              f.write(f'#define LOGO_H {h}\n\n')
              f.write('static u32 __attribute__((aligned(16))) logo_pixels[] = {\n')
              for y in range(h):
                  row = []
                  for x in range(w):
                      r, g, b, a = img.getpixel((x, y))
                      ps2_a = int(round((a / 255.0) * 128.0))
                      val = (ps2_a << 24) | (b << 16) | (g << 8) | r
                      row.append(f'0x{val:08x}')
                  f.write('\t' + ', '.join(row) + ',\n')
              f.write('};\n')
          EOF

          cat << 'EOF' > splash_src/main.c
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifrpc.h>
          #include <loadfile.h>
          #include <iopcontrol.h>
          #include <iopheap.h>
          #include <sbv_patches.h>
          #include <gsKit.h>
          #include <dmaKit.h>
          #include <unistd.h>
          #include "logo_data.h"

          int main(int argc, char *argv[]) {
              SifInitRpc(0);
              while (!SifIopReset("", 0)) {};
              while (!SifIopSync()) {};
              SifInitRpc(0);
              sbv_patch_enable_lmb();
              sbv_patch_disable_prefix_check();

              GSGLOBAL *gsGlobal = gsKit_init_global();
              GSTEXTURE tex;
              dmaKit_init(D_CTRL_RELE_OFF, D_CTRL_MFD_OFF, D_CTRL_STS_UNSPEC, D_CTRL_STD_OFF, D_CTRL_RCYC_8, 1 << DMA_CHANNEL_GIF);
              dmaKit_chan_init(DMA_CHANNEL_GIF);

              gsGlobal->PrimAlphaEnable = GS_SETTING_ON;
              gsKit_init_screen(gsGlobal);
              gsKit_mode_switch(gsGlobal, GS_ONESHOT);

              tex.Width = LOGO_W;
              tex.Height = LOGO_H;
              tex.PSM = GS_PSM_CT32;
              tex.Mem = logo_pixels;
              tex.Vram = gsKit_vram_alloc(gsGlobal, gsKit_texture_size(tex.Width, tex.Height, tex.PSM), GSKIT_ALLOC_USERBUFFER);
              gsKit_texture_upload(gsGlobal, &tex);

              float x = (gsGlobal->Width - LOGO_W) / 2.0f;
              float y = (gsGlobal->Height - LOGO_H) / 2.0f;

              gsKit_clear(gsGlobal, GS_SETREG_RGBAQ(0x00, 0x00, 0x00, 0x80, 0x00));
              gsKit_prim_sprite_texture(gsGlobal, &tex, x, y, 0.0f, 0.0f, x + LOGO_W, y + LOGO_H, LOGO_W, LOGO_H, 1, GS_SETREG_RGBAQ(0x80, 0x80, 0x80, 0x80, 0x00));
              gsKit_queue_exec(gsGlobal);
              gsKit_sync_flip(gsGlobal);

              sleep(3);

              const char *targets[] = {
                  "mc0:/APPS/OPNPS2LD.ELF",
                  "mc1:/APPS/OPNPS2LD.ELF",
                  "mc0:/BOOT/BOOT2.ELF",
                  "mc0:/BOOT/BOOT.ELF",
                  "mass:/BOOT/BOOT.ELF",
                  NULL
              };
              for (int i = 0; targets[i] != NULL; i++) {
                  FILE *f = fopen(targets[i], "rb");
                  if (f) {
                      fclose(f);
                      LoadExecPS2(targets[i], 0, NULL);
                  }
              }
              return 0;
          }
          EOF

          cat << 'EOF' > splash_src/Makefile
          EE_BIN = NABIL_SPLASH.ELF
          EE_OBJS = main.o
          EE_LIBS = -lgskit -ldmakit -lpatches -lkernel
          EE_CFLAGS += -I$(PS2DEV)/gsKit/include
          EE_LDFLAGS += -L$(PS2DEV)/gsKit/lib -Wl,--defsym -Wl,_start_addr=0x01800000
          all: $(EE_BIN)
          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

          docker run --rm -v "$PWD/splash_src:/src" -w /src ps2dev/ps2dev:v1.2.0 sh -c "export PS2DEV=/usr/local/ps2dev && export PS2SDK=\$PS2DEV/ps2sdk && export PATH=\$PATH:\$PS2DEV/bin:\$PS2DEV/ee/bin:\$PS2DEV/iop/bin:\$PS2DEV/dvp/bin:\$PS2SDK/bin && apk add --no-cache make gcc g++ && make"
      - uses: actions/upload-artifact@v4
        with:
          name: NABIL-SPLASH-LAUNCHER
          path: splash_src/NABIL_SPLASH.ELF
