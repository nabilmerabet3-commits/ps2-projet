name: Build PS2 Launcher
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PS2DEV & Compile NBIL_999.99
        run: |
          sudo mkdir -p /usr/local
          sudo wget -q https://github.com/ps2dev/ps2dev/releases/latest/download/ps2dev-ubuntu-latest.tar.gz -O /tmp/ps2dev.tar.gz
          sudo tar -xzf /tmp/ps2dev.tar.gz -C /usr/local
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin

          GSKIT_INC=$(dirname $(find /usr/local/ps2dev -name "gsKit.h" | head -n 1))
          GSKIT_LIB=$(dirname $(find /usr/local/ps2dev -name "libgskit.a" | head -n 1))
          PACKER=$(find /usr/local/ps2dev -type f -name "ps2-packer" | head -n 1)

          BMP_FILE=$(ls *.bmp *.BMP 2>/dev/null | head -n 1)
          bin2c "$BMP_FILE" splash.c splash_bmp

          cat << EOF > Makefile
          EE_BIN = BOOT_raw.elf
          EE_OBJS = main.o
          EE_INCS = -I$GSKIT_INC -I\$(PS2SDK)/ports/include
          EE_LDFLAGS = -L$GSKIT_LIB -L\$(PS2SDK)/ports/lib -Wl,-Ttext,0x00200000
          EE_LIBS = -lgskit -ldmakit -lpatches -lc -lkernel
          all: \$(EE_BIN)
          include \$(PS2SDK)/samples/Makefile.pref
          include \$(PS2SDK)/samples/Makefile.eeglobal
          EOF

          cat << 'EOF' > main.c
          #include <kernel.h>
          #include <sifrpc.h>
          #include <loadfile.h>
          #include <sbv_patches.h>
          #include <string.h>
          #include <malloc.h>
          #include <gsKit.h>
          #include <dmaKit.h>
          #include "splash.c"

          #define GAME_ELF "cdrom0:\\BOOT.01;1"
          #define SHOW_FRAMES 200
          #define FADE_FRAMES 30

          int main(int argc, char *argv[]) {
              unsigned char *bmp = splash_bmp;
              int off = *(int *)(bmp + 10), w = *(int *)(bmp + 18), h = *(int *)(bmp + 22);
              int abs_h = (h < 0) ? -h : h, bpp = *(short *)(bmp + 28), bytes_pp = bpp / 8;
              int row_stride = (w * bytes_pp + 3) & ~3;
              u16 *px; GSGLOBAL *gs; GSTEXTURE tex; int x, y, i;

              SifInitRpc(0);
              sbv_patch_enable_lmb();
              sbv_patch_disable_prefix_check();

              gs = gsKit_init_global();
              gs->Mode = GS_MODE_PAL;
              gs->Width = 640;
              gs->Height = 512;
              gs->PSM = GS_PSM_CT16; gs->PSMZ = GS_PSMZ_16;
              gs->DoubleBuffering = GS_SETTING_OFF;
              gs->ZBuffering = GS_SETTING_OFF;
              gs->PrimAlphaEnable = GS_SETTING_ON;

              dmaKit_init(D_CTRL_RELE_OFF, D_CTRL_MFD_OFF, D_CTRL_STS_UNSPEC, D_CTRL_STD_OFF, D_CTRL_RCYC_8, 1 << DMA_CHANNEL_GIF);
              dmaKit_chan_init(DMA_CHANNEL_GIF);
              gsKit_init_screen(gs);
              gsKit_mode_switch(gs, GS_ONESHOT);

              if ((bpp == 24 || bpp == 32) && w > 0 && abs_h > 0) {
                  px = (u16 *)memalign(128, w * abs_h * 2);
                  for (y = 0; y < abs_h; y++) {
                      int src_y = (h > 0) ? (abs_h - 1 - y) : y;
                      unsigned char *src = bmp + off + src_y * row_stride;
                      u16 *dst = px + y * w;
                      for (x = 0; x < w; x++) {
                          u8 r = src[x * bytes_pp + 2] >> 3;
                          u8 g = src[x * bytes_pp + 1] >> 3;
                          u8 b = src[x * bytes_pp + 0] >> 3;
                          dst[x] = (1 << 15) | (b << 10) | (g << 5) | r;
                      }
                  }
                  memset(&tex, 0, sizeof(tex));
                  tex.Width = w; tex.Height = abs_h; tex.PSM = GS_PSM_CT16; tex.Mem = (void *)px; tex.Filter = GS_FILTER_LINEAR;
                  tex.Vram = gsKit_vram_alloc(gs, gsKit_texture_size(tex.Width, tex.Height, tex.PSM), GSKIT_ALLOC_USERBUFFER);
                  gsKit_texture_upload(gs, &tex);

                  for (i = 0; i < SHOW_FRAMES; i++) {
                      u8 lum = 0x80;
                      if (i < FADE_FRAMES) {
                          lum = (u8)((0x80 * i) / FADE_FRAMES);
                      } else if (i >= SHOW_FRAMES - FADE_FRAMES) {
                          lum = (u8)((0x80 * (SHOW_FRAMES - 1 - i)) / FADE_FRAMES);
                      }
                      gsKit_clear(gs, GS_SETREG_RGBAQ(0, 0, 0, 0, 0));
                      gsKit_prim_sprite_texture(gs, &tex, 0, 0, 0, 0, gs->Width, gs->Height, w, abs_h, 1, GS_SETREG_RGBAQ(lum, lum, lum, 0x80, 0));
                      gsKit_queue_exec(gs);
                      gsKit_sync_flip(gs);
                  }
                  free(px);
              }

              gsKit_clear(gs, GS_SETREG_RGBAQ(0, 0, 0, 0, 0));
              gsKit_queue_exec(gs);
              gsKit_sync_flip(gs);
              gsKit_deinit_global(gs);

              FlushCache(0);
              FlushCache(2);
              LoadExecPS2(GAME_ELF, 0, NULL);
              SleepThread();
              return 0;
          }
          EOF

          make && "$PACKER" BOOT_raw.elf NBIL_999.99

      - uses: actions/upload-artifact@v4
        with:
          name: NBIL_999.99-ELF
          path: NBIL_999.99
