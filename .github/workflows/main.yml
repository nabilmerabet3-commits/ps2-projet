name: Build Custom FMCB 1.8 Installer
on: [push, workflow_dispatch]
jobs:
  build-fmcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect & Compile FMCB 1.8 Launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil git
          git clone --depth 1 https://github.com/ps2homebrew/FreeMcBoot.git fmcb_src || git clone --depth 1 https://github.com/AKuHAK/FreeMcBoot.git fmcb_src
          echo "=== CONTENU DE LAUNCHER1 ET LAUNCHER2 ==="
          find fmcb_src/launcher1 fmcb_src/launcher2 -type f
          echo "=== MAKEFILE RACINE ==="
          cat fmcb_src/Makefile

          docker run --rm -v "$PWD/fmcb_src:/src" -w /src ps2dev/ps2dev:v1.2.0 sh -c "export PS2DEV=/usr/local/ps2dev && export PS2SDK=\$PS2DEV/ps2sdk && export PATH=\$PATH:\$PS2DEV/bin:\$PS2DEV/ee/bin:\$PS2DEV/iop/bin:\$PS2DEV/dvp/bin:\$PS2SDK/bin && find \$PS2SDK -name '*.h' -exec sed -i 's/#error/\/\/#error/g' {} + && apk add --no-cache make gcc g++ && make -C launcher1 && make -C launcher2"
      - uses: actions/upload-artifact@v4
        with:
          name: FMCB-1.8-LAUNCHER
          path: fmcb_src/launcher*/*.ELF
