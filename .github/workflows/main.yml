name: Build Custom OPL 1.1.0
on: [push, workflow_dispatch]
jobs:
  build-opl:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:v1.2.0
    steps:
      - uses: actions/checkout@v4
      - name: Clone OPL v1.1.0, replace logo & compile
        run: |
          apk add --no-cache git make gcc g++ zlib-dev libpng-dev freetype-dev
          git clone --depth 1 --branch v1.1.0 https://github.com/ps2homebrew/Open-PS2-Loader.git opl_src
          cp -f logo.png opl_src/gfx/logo.png
          cd opl_src
          make clean
          make release
      - uses: actions/upload-artifact@v4
        with:
          name: OPNPS2LD-1.1.0-CUSTOM
          path: opl_src/OPNPS2LD.ELF
